name: Autonomous Maintenance

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run self-heal gates
        id: heal
        continue-on-error: true
        run: |
          node scripts/self-heal.mjs check 2>&1 | tail -10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Diagnose with Gemini if gates failed
        if: steps.heal.outcome != 'success'
        run: |
          node scripts/self-heal.mjs diagnose 2>&1 | tail -25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Report system state
        run: |
          node scripts/system-status.mjs check 2>&1 | tail -12
