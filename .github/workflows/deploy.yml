name: Deploy to Heroku
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Run operating model audit
        run: npm run phase:ops-audit

      - name: Run typecheck
        run: npm run typecheck

      - name: Deploy to Heroku Staging
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging' || github.ref == 'refs/heads/main'
        uses: akhileshns/heroku-deploy@v3.14.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: kudbee-fuel-gage-staging
          heroku_email: dominick.ziola@gmail.com
          branch: main
          usedocker: false
          buildpack: heroku/nodejs
          dontuseforce: true

      - name: Deploy to Heroku Production
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
        uses: akhileshns/heroku-deploy@v3.14.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: kudbee-fuel-gage
          heroku_email: dominick.ziola@gmail.com
          branch: main
          usedocker: false
          buildpack: heroku/nodejs
          dontuseforce: true

      - name: Run release verification
        run: |
          sleep 15
          if [ "${{ github.event.inputs.target }}" == "staging" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
             curl --fail --show-error --silent https://kudbee-fuel-gage-staging-99f1b73b65b2.herokuapp.com/health
          else
            curl --fail --show-error --silent https://kudbee-fuel-gage-330ade653a62.herokuapp.com/health
          fi
