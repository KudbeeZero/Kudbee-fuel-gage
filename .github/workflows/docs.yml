name: Docs Check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.kilo/**'
      - 'scripts/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docs-only change detected
        run: echo "Docs-only change — skipping full CI"