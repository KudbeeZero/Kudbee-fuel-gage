name: Deploy to Heroku Staging
on:
  push:
    branches: [session/*]

jobs:
  deploy-staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Run operating model audit
        run: npm run phase:ops-audit

      - name: Run typecheck
        run: npm run typecheck

      - name: Deploy to Heroku Staging
        uses: akhileshns/heroku-deploy@v3.14.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: kudbee-fuel-gage-staging
          heroku_email: dominick.ziola@gmail.com
          branch: ${{ github.ref_name }}
          usedocker: false
          buildpack: heroku/nodejs
          dontuseforce: true

      - name: Run release verification
        run: |
          sleep 15
           curl --fail --show-error --silent https://kudbee-fuel-gage-staging-99f1b73b65b2.herokuapp.com/health
