name: Kudbee Bounded CI

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'bun.lock*'
      - 'turbo.json'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'bun.lock*'
      - 'turbo.json'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kudbee-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      MAX_REQUEST_BODY: 256kb
      CI_MUTATION_BUDGET: '20'
      E2E_ALLOW_DATABASE_WRITES: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Machine-verifiable invariants
        run: node scripts/verify-invariants.mjs
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      - name: TypeScript 7 compliance
        run: npm run verify:typescript
      - name: Node crypto runtime
        run: npm run verify:crypto
      - name: Secret hygiene
        run: npm run verify:secrets
      - name: Required config vars (INV-019)
        run: node scripts/verify-config-vars.mjs --heroku production
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      - name: Agent contracts
        run: npm run verify:agent-contracts || true
      - name: Integration capabilities
        run: npm run verify:integrations || true
      - name: Learning protocol
        run: npm run verify:learning-protocol || true
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (bun)
        run: bun test
      - name: Governance validation (THINK Governance Engine)
        run: node scripts/protocol-guard.mjs status || true
      - name: Mission validation
        run: node scripts/protocol-guard.mjs pre-pr || true
      - name: Memory validation (runtime churn check)
        run: node scripts/protocol-guard.mjs guard || true
      - name: Stack validation
        run: node scripts/verify-stack.mjs || true
      - name: Build
        run: npm run build
      - name: Bounded smoke
        continue-on-error: true
        run: npm run verify:ci-smoke || true
