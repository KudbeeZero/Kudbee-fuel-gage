name: Deploy to Render

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'
      - '.npmrc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK secret not set — skipping."
            echo "Render Blueprint auto-sync already deploys on push to main."
            echo "To enable the hook trigger: GitHub repo Settings → Secrets →"
            echo "Actions → RENDER_DEPLOY_HOOK = deploy hook URL from Render Dashboard."
            exit 0
          fi
          code=$(curl -s -X POST -o /dev/null -w "%{http_code}" "$RENDER_DEPLOY_HOOK")
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo "::error::Render deploy hook returned HTTP $code"
            exit 1
          fi
          echo "Render deploy triggered (HTTP $code)"
