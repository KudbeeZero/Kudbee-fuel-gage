<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kudbee Terminal" />
    <meta name="theme-color" content="#020617" />
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <title>KUDBEE Terminal</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      :root{
        --bg:#020617;--surface:#0b1120;--card:#0f172a;--card-hover:#1e293b;
        --border:#1e293b;--border-active:#334155;
        --text:#e2e8f0;--text-dim:#94a3b8;--muted:#64748b;
        --emerald:#34d399;--emerald-bg:rgba(52,211,153,.08);
        --amber:#f59e0b;--amber-bg:rgba(245,158,11,.08);
        --rose:#f87171;--rose-bg:rgba(248,113,113,.08);
        --blue:#60a5fa;--blue-bg:rgba(96,165,250,.08);
        --violet:#a78bfa;
        --radius:10px;
        --safe-bottom:env(safe-area-inset-bottom,0px);
        --glow-emerald:0 0 12px rgba(52,211,153,.35);
        --glow-blue:0 0 12px rgba(96,165,250,.35);
      }
      html,body{height:100%}
      body{
        font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
        background:
          radial-gradient(ellipse 90% 60% at 20% -10%, rgba(96,165,250,.07), transparent),
          radial-gradient(ellipse 70% 50% at 90% 0%, rgba(167,139,250,.06), transparent),
          var(--bg);
        color:var(--text);min-height:100vh;
        -webkit-font-smoothing:antialiased;
      }
      #app{display:flex;height:100vh;overflow:hidden}
      /* ── Launch ── */
      #launch{
        position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        background:
          radial-gradient(ellipse 60% 50% at 50% 40%, rgba(52,211,153,.08), transparent),
          radial-gradient(ellipse 50% 40% at 30% 30%, rgba(96,165,250,.08), transparent),
          var(--bg);
        transition:opacity .4s,visibility .4s;
      }
      #launch.hidden{opacity:0;visibility:hidden;pointer-events:none}
      #launch-logo{
        font-size:34px;font-weight:800;letter-spacing:-.02em;
        background:linear-gradient(135deg,#6ee7b7,var(--blue),var(--violet));
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        animation:logoPulse 3s ease-in-out infinite;
      }
      @keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(52,211,153,.2))}50%{filter:drop-shadow(0 0 20px rgba(96,165,250,.4))}}
      #launch-sub{font-size:11px;color:var(--text-dim);margin:6px 0 30px;letter-spacing:.08em}
      #launch-bar{width:240px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;box-shadow:0 0 10px rgba(52,211,153,.15)}
      #launch-fill{height:100%;width:0;background:linear-gradient(90deg,var(--emerald),var(--blue));transition:width .3s;box-shadow:0 0 8px rgba(52,211,153,.5)}
      #launch-msg{font-size:10px;color:var(--text-dim);margin-top:12px;min-height:14px}
      /* ── Left ── */
      #sidebar{width:250px;min-width:250px;background:linear-gradient(180deg,rgba(15,23,42,.9),rgba(11,17,32,.95));border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;backdrop-filter:blur(8px)}
      .side-section{border-bottom:1px solid var(--border);padding:12px 14px}
      .side-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:6px}
      .agent-item{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;font-size:11px;transition:background .12s}
      .agent-item:hover{background:var(--card-hover)}
      .agent-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
      .agent-dot.online{background:var(--emerald);box-shadow:var(--glow-emerald)}
      .agent-dot.unknown{background:var(--muted)}
      .agent-subs{font-size:9px;color:var(--muted);margin-left:auto}
      /* ── Shield ── */
      .shield-metric{margin-bottom:7px}
      .shield-row{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px}
      .shield-key{font-weight:700}
      .shield-val{color:var(--muted);font-size:9px}
      .shield-track{height:4px;border-radius:2px;background:var(--border);overflow:hidden}
      .shield-fill{height:100%;border-radius:2px;transition:width .3s}
      /* ── Main ── */
      #main{flex:1;display:flex;flex-direction:column;overflow:hidden}
      #topbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);background:rgba(11,17,32,.85);font-size:10px;backdrop-filter:blur(8px)}
      .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
      .dot.live{background:var(--emerald);box-shadow:var(--glow-emerald);animation:livePulse 2s ease-in-out infinite}
      @keyframes livePulse{0%,100%{opacity:1}50%{opacity:.6}}
      .dot.degraded{background:var(--amber);box-shadow:0 0 8px var(--amber)}
      .dot.offline{background:var(--rose);box-shadow:0 0 8px var(--rose)}
      .spacer{flex:1}
      .badge{font-size:9px;padding:2px 8px;border-radius:10px;background:var(--border);color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
      /* ── Output ── */
      #output{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:4px;
        scrollbar-width:thin;scrollbar-color:var(--border) transparent}
      #output::-webkit-scrollbar{width:6px}
      #output::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
      #output .msg{padding:9px 13px;border-radius:var(--radius);font-size:12px;max-width:88%;line-height:1.5;animation:msgIn .18s ease-out}
      @keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
      #output .msg.cmd{align-self:flex-end;background:linear-gradient(135deg,var(--blue),#3b82f6);color:#fff;font-weight:600;border-radius:var(--radius) var(--radius) 4px var(--radius);box-shadow:0 2px 10px rgba(96,165,250,.2)}
      #output .msg.resp{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-radius:4px var(--radius) var(--radius) var(--radius);box-shadow:0 1px 6px rgba(0,0,0,.3)}
      #output .msg.error{align-self:flex-start;background:var(--rose-bg);border:1px solid rgba(248,113,113,.3);color:var(--rose)}
      #output .msg.info{align-self:center;font-size:10px;color:var(--muted);background:transparent;padding:3px 8px;max-width:100%}
      #output .mono{font-family:inherit;font-size:10px;color:var(--text-dim);white-space:pre-wrap;word-break:break-word;margin-top:3px}
      /* ── Quick commands ── */
      #quickbar{display:flex;gap:6px;padding:6px 14px 0;flex-wrap:wrap}
      .qc{font-size:9px;padding:3px 9px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text-dim);cursor:pointer;transition:all .15s}
      .qc:hover{border-color:var(--emerald);color:var(--emerald);box-shadow:0 0 8px rgba(52,211,153,.15)}
      /* ── Input ── */
      #input-bar{display:flex;padding:9px 14px;border-top:1px solid var(--border);background:rgba(11,17,32,.85);gap:8px;backdrop-filter:blur(8px)}
      #cmd-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:9px 13px;color:var(--text);font:inherit;font-size:12px;outline:none;transition:border-color .15s,box-shadow .15s}
      #cmd-input:focus{border-color:var(--emerald);box-shadow:0 0 0 1px var(--emerald),0 0 12px rgba(52,211,153,.12)}
      #run-btn{padding:9px 16px;background:linear-gradient(135deg,var(--emerald),#10b981);color:#020617;border:none;border-radius:var(--radius);font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s}
      #run-btn:hover{opacity:.9;transform:translateY(-1px)}
      #run-btn:active{transform:translateY(0)}
      /* ── Right ── */
      #right{width:240px;min-width:240px;background:linear-gradient(180deg,rgba(15,23,42,.9),rgba(11,17,32,.95));border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;backdrop-filter:blur(8px)}
      .phase-item{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;border-radius:4px;font-size:10px;transition:background .12s}
      .phase-item:hover{background:var(--card-hover)}
      .phase-id{font-weight:700;font-size:9px;width:38px;flex-shrink:0;color:var(--text-dim)}
      .phase-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .phase-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
      .p-shipped{color:var(--emerald)}.p-verified{color:var(--blue)}.p-in_progress{color:var(--amber)}.p-planned{color:var(--muted)}
      .bus-feed{font-size:9px;color:var(--muted)}
      .bus-feed div{padding:2px 0;border-bottom:1px solid rgba(30,41,59,.4)}
      /* ── Pulse (engineering health) ── */
      .pulse-row{display:flex;justify-content:space-between;font-size:10px;padding:2px 0}
      .pulse-val{font-weight:700}
      .pulse-val.ok{color:var(--emerald)}.pulse-val.warn{color:var(--amber)}
      /* ── Terminal pro features ── */
      .msg{position:relative}
      .copy-btn{
        position:absolute;top:6px;right:6px;opacity:0;border:none;background:var(--border);
        color:var(--text-dim);border-radius:4px;font-size:10px;padding:2px 6px;cursor:pointer;
        transition:opacity .15s,background .15s;
      }
      .msg:hover .copy-btn{opacity:1}
      .copy-btn:hover{background:var(--border-active);color:var(--text)}
      .thinking{font-style:italic;animation:thinkingPulse 1.2s ease-in-out infinite}
      @keyframes thinkingPulse{0%,100%{opacity:.5}50%{opacity:1}}
      .mono.pretty{background:rgba(2,6,23,.5);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:10px;line-height:1.5;overflow-x:auto;margin-top:4px;color:var(--text-dim)}
      .statusbar{
        display:flex;align-items:center;gap:12px;padding:5px 14px;border-top:1px solid var(--border);
        background:rgba(2,6,23,.8);font-size:9px;color:var(--muted);letter-spacing:.05em;
      }
      .statusbar .spacer{flex:1}
      .status-hint{color:var(--muted);opacity:.8}
      #palette{
        position:fixed;inset:0;z-index:200;background:rgba(2,6,23,.7);backdrop-filter:blur(4px);
        display:flex;align-items:flex-start;justify-content:center;padding-top:15vh;
      }
      .palette-box{
        width:420px;max-width:92vw;background:var(--card);border:1px solid var(--border-active);
        border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden;
      }
      .palette-input{
        width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);
        padding:12px 14px;color:var(--text);font:inherit;font-size:13px;outline:none;
      }
      .palette-list{max-height:300px;overflow-y:auto}
      .palette-item{
        display:flex;justify-content:space-between;padding:8px 14px;font-size:12px;cursor:pointer;
        transition:background .1s;
      }
      .palette-item:hover{background:var(--card-hover)}
      .palette-cmd{color:var(--emerald);font-weight:600}
      .palette-desc{color:var(--muted);font-size:10px}
      /* ── Mobile ── */
      @media(max-width:820px){
        #launch-logo{font-size:22px}
        #launch-sub{font-size:10px;margin:4px 0 18px}
        #launch-bar{width:180px}
        #sidebar,#right{display:none!important}
        #main{width:100%}
        #topbar{padding:8px 10px;font-size:9px;gap:6px;min-height:36px}
        .badge{font-size:8px;padding:1px 6px}
        #quickbar{
          padding:6px 8px 0;gap:4px;overflow-x:auto;flex-wrap:nowrap;
          -webkit-overflow-scrolling:touch;scrollbar-width:none;
        }
        #quickbar::-webkit-scrollbar{display:none}
        .qc{
          font-size:9px;padding:5px 11px;border-radius:14px;
          flex-shrink:0;white-space:nowrap;
          -webkit-tap-highlight-color:transparent;
        }
        #output{padding:10px;gap:6px}
        #output .msg{font-size:13px;padding:10px 14px;max-width:95%;line-height:1.5}
        #output .msg.cmd{font-size:12px}
        #output .mono{font-size:10px}
        #input-bar{
          padding:8px 10px calc(8px + var(--safe-bottom));gap:8px;
          position:sticky;bottom:0;background:var(--surface);
          z-index:10;border-top:1px solid var(--border);
        }
        #cmd-input{
          font-size:14px;padding:11px 14px;min-height:44px;
          border-radius:10px;
        }
        #run-btn{
          font-size:14px;padding:10px 14px;min-width:56px;min-height:44px;
          border-radius:10px;
        }
      }
      @media(max-width:420px){
        #quickbar{gap:3px;padding:4px 6px 0}
        .qc{font-size:8px;padding:4px 8px}
        #output .msg{font-size:12px;padding:8px 10px}
        #output .info{font-size:9px}
      }
    </style>
  </head>
  <body>
    <div id="launch">
      <div id="launch-logo">KUDBEE</div>
      <div id="launch-sub">Engineering OS v2.4.1 — Enterprise Control</div>
      <div id="launch-bar"><div id="launch-fill"></div></div>
      <div id="launch-msg">Initializing terminal runtime...</div>
    </div>

    <div id="app">
      <!-- Left: fleet + shield -->
      <div id="sidebar">
        <div class="side-section">
          <div class="side-label">Swarm Fleet</div>
          <div id="swarm-tree"><span style="color:var(--muted);font-size:10px">connecting...</span></div>
        </div>
        <div class="side-section">
          <div class="side-label">Shield (P·L·R·I)</div>
          <div id="shield-metrics"><span style="color:var(--muted);font-size:10px">connecting...</span></div>
        </div>
      </div>

      <!-- Main -->
      <div id="main">
        <div id="topbar">
          <span class="dot offline" id="sys-dot"></span>
          <span id="sys-status">OFFLINE</span>
          <span class="spacer"></span>
          <span id="sys-branch" class="badge">—</span>
          <span id="sys-env" class="badge">STAGING</span>
        </div>
        <div id="quickbar">
          <span class="qc" onclick="quick('/swarm')">swarm</span>
          <span class="qc" onclick="quick('/shield')">shield</span>
          <span class="qc" onclick="quick('/roadmap')">roadmap</span>
          <span class="qc" onclick="quick('/pulse')">pulse</span>
          <span class="qc" onclick="quick('/security')">security</span>
          <span class="qc" onclick="quick('/echo')">echo</span>
          <span class="qc" onclick="quick('/forecast')">forecast</span>
          <span class="qc" onclick="quick('/handoff')">handoff</span>
        </div>
        <div id="output"></div>
        <div id="input-bar">
          <input id="cmd-input" placeholder="/ask What is the current mission?" autofocus autocomplete="off"
            onkeydown="if(event.key==='Enter')execute()" />
          <button id="run-btn" onclick="execute()">RUN</button>
        </div>
      </div>

      <!-- Right: pulse + roadmap + bus -->
      <div id="right">
        <div class="side-section">
          <div class="side-label">Engineering Health</div>
          <div id="pulse"><span style="color:var(--muted);font-size:10px">connecting...</span></div>
        </div>
        <div class="side-section">
          <div class="side-label">Roadmap</div>
          <div id="roadmap"><span style="color:var(--muted);font-size:10px">connecting...</span></div>
        </div>
        <div class="side-section">
          <div class="side-label">Bus Feed</div>
          <div class="bus-feed" id="bus-feed"><span style="color:var(--muted);font-size:10px">connecting...</span></div>
        </div>
      </div>
    </div>

    <script>
      const API = '';
      const cmds = []; let cmdIdx = -1;

      // ── Command registry (drives /help, tab completion, palette) ──
      const COMMANDS = {
        '/status': 'Fleet + shield status', '/swarm': 'Agent tree', '/shield': 'P·L·R·I shield',
        '/roadmap': 'Phase roadmap', '/pulse': 'Engineering health', '/health': 'Dependency health',
        '/security': 'Security posture', '/echo': 'Prompt library', '/forecast': 'Failure forecast',
        '/agents': 'Agent fleet', '/ask': 'Ask Gemini (or fallback)', '/code': 'Generate code',
        '/handoff': 'Session handoff', '/help': 'Show this help', '/clear': 'Clear output',
        '/sync': 'Real-time sync', '/report': 'Standard report', '/patch': 'Live state patch',
      };

      // ── Launch ──
      (async function boot(){
        const fill = document.getElementById('launch-fill');
        const msg = document.getElementById('launch-msg');
        const steps = [
          ['Connecting to Control Tower...', 20],
          ['Verifying agent fleet...', 45],
          ['Loading shield metrics...', 70],
          ['Syncing roadmap + health...', 90],
          ['Ready.', 100]
        ];
        for(const [text, pct] of steps){
          fill.style.width = pct + '%';
          msg.textContent = text;
          await new Promise(r => setTimeout(r, 250));
        }
        document.getElementById('launch').classList.add('hidden');
        init();
      })();

      async function call(endpoint, opts = {}){
        try {
          const res = await fetch(API + endpoint, {
            headers: {'Content-Type':'application/json'},
            signal: AbortSignal.timeout(30000), ...opts
          });
          return await res.json();
        } catch { return { error: 'network' }; }
      }

      // ── Top bar ──
      async function updateTopBar(){
        const h = await call('/health');
        if(!h || h.error){ setTop('OFFLINE','offline'); return; }
        sysOnline = h.status === 'ok' || h.dependencies;
        setTop(sysOnline ? 'ONLINE' : 'DEGRADED', sysOnline ? 'live' : 'degraded');
        document.getElementById('sys-env').textContent = (h.phase || '—').toUpperCase();
      }
      function setTop(label, cls){
        document.getElementById('sys-status').textContent = label;
        document.getElementById('sys-dot').className = 'dot ' + cls;
      }

      // ── Fleet ──
      async function updateSwarm(){
        const r = await call('/api/terminal/execute', { method:'POST', body:JSON.stringify({command:'/swarm'}) });
        if(!r || r.type !== 'swarm:status') return;
        document.getElementById('swarm-tree').innerHTML = (r.tree||[]).map(a =>
          '<div class="agent-item"><span class="agent-dot ' + (a.status==='online'?'online':'unknown') + '"></span>'
          + a.agent + '<span class="agent-subs">' + (a.subs?.length||0) + '</span></div>'
        ).join('');
      }

      // ── Shield ──
      async function updateShield(){
        const r = await call('/api/terminal/execute', { method:'POST', body:JSON.stringify({command:'/shield'}) });
        if(!r || r.type !== 'shield:metrics') return;
        const layers = r.layers || {};
        let h = '';
        for(const [k,l] of Object.entries(layers)){
          const mag = l.magnitude||0, safe = l.status==='safe';
          h += '<div class="shield-metric"><div class="shield-row"><span class="shield-key">' + l.name + ' (' + k + ')</span>'
            + '<span class="shield-val">' + mag.toFixed(2) + '</span></div>'
            + '<div class="shield-track"><div class="shield-fill" style="width:' + (mag*100) + '%;background:' + (safe?'var(--emerald)':'var(--amber)') + '"></div></div></div>';
        }
        document.getElementById('shield-metrics').innerHTML = h;
      }

      // ── Roadmap ──
      async function updateRoadmap(){
        const r = await call('/api/terminal/execute', { method:'POST', body:JSON.stringify({command:'/roadmap'}) });
        if(!r || r.total === undefined) return;
        document.getElementById('roadmap').innerHTML = (r.phases||[]).map(p =>
          '<div class="phase-item"><span class="phase-id p-' + p.status + '">' + p.id + '</span>'
          + '<span class="phase-name">' + p.name + '</span><span class="phase-dot p-' + p.status + '"></span></div>'
        ).join('');
      }

      // ── Engineering health pulse ──
      async function updatePulse(){
        const r = await call('/api/terminal/execute', { method:'POST', body:JSON.stringify({command:'/pulse'}) });
        if(!r || r.type !== 'health:pulse') return;
        const m = r.metrics || {};
        const row = (label, val, ok) =>
          '<div class="pulse-row"><span>' + label + '</span><span class="pulse-val ' + (ok?'ok':'warn') + '">' + val + '</span></div>';
        document.getElementById('pulse').innerHTML =
          row('CI', (m.ciDetail||'?') + ' ' + (m.ci||0) + '%', (m.ci||0) >= 90) +
          row('Tests/E2E', (m.tests||'?') + ' / ' + (m.e2e||'?'), true) +
          row('Agents', (m.agents||'?') + '/11', (m.agents||0) >= 10) +
          row('Knowledge', (m.knowledgeHealth||0) + '%', (m.knowledgeHealth||0) >= 90) +
          row('Mock data', m.mockData || 0, !(m.mockData > 0)) +
          row('Bootstrap', (m.bootstrapAgeHours ?? '?') + 'h', (m.bootstrapAgeHours ?? 24) < 24) +
          row('Avg PR files', m.avgPrFiles || '?', true) +
          row('Learning', m.learningEventsToday || 0, true);
      }

      // ── Bus ──
      async function updateBus(){
        const r = await call('/api/ci/status');
        document.getElementById('bus-feed').innerHTML =
          '<div>CI: ' + (r.status||'?') + '</div><div>last: ' + (r.lastRun ? new Date(r.lastRun).toLocaleTimeString() : '—') + '</div>';
      }

      // ── Terminal core ──
      let _thinkingEl = null;

      function showThinking(text){
        if(_thinkingEl) hideThinking();
        const o = document.getElementById('output');
        _thinkingEl = document.createElement('div');
        _thinkingEl.className = 'msg info thinking';
        _thinkingEl.textContent = text || 'thinking...';
        o.appendChild(_thinkingEl); o.scrollTop = o.scrollHeight;
      }
      function hideThinking(){
        if(_thinkingEl){ _thinkingEl.remove(); _thinkingEl = null; }
      }

      function renderValue(v){
        if(v === null || v === undefined) return String(v);
        if(typeof v === 'object'){
          try {
            const pretty = JSON.stringify(v, null, 2);
            const pre = document.createElement('pre');
            pre.className = 'mono pretty';
            pre.textContent = pretty;
            return pre;
          } catch { return document.createTextNode(String(v)); }
        }
        return document.createTextNode(String(v));
      }

      function addMsg(type, text, extra, extraObj){
        const o = document.getElementById('output');
        const d = document.createElement('div');
        d.className = 'msg ' + type;
        if(type === 'resp' && typeof text === 'string' && (text.includes('\n') || text.includes('```'))){
          // Render code blocks + newlines in responses.
          const pre = document.createElement('pre');
          pre.className = 'mono pretty';
          pre.textContent = text;
          d.appendChild(pre);
        } else {
          d.appendChild(document.createTextNode(typeof text === 'string' ? text : String(text)));
        }
        if(extraObj !== undefined){
          d.appendChild(renderValue(extraObj));
        } else if(extra){
          const p = document.createElement('div'); p.className='mono'; p.textContent = extra; d.appendChild(p);
        }
        // Copy button on responses + errors
        if(type === 'resp' || type === 'error'){
          const btn = document.createElement('button');
          btn.className = 'copy-btn'; btn.textContent = '⧉';
          btn.title = 'Copy to clipboard';
          btn.onclick = () => {
            const txt = d.textContent.replace(/⧉$/, '').trim();
            navigator.clipboard?.writeText(txt).then(() => {
              btn.textContent = '✓'; setTimeout(() => { btn.textContent = '⧉'; }, 1200);
            });
          };
          d.appendChild(btn);
        }
        o.appendChild(d);
        o.scrollTop = o.scrollHeight;
      }

      function addHelp(){
        const lines = Object.entries(COMMANDS).map(([c, desc]) => c.padEnd(12) + '  ' + desc).join('\n');
        addMsg('resp', lines);
      }

      async function execute(cmd){
        const input = document.getElementById('cmd-input');
        const command = cmd || input.value.trim();
        if(!command) return;

        // Local commands first
        const local = command.toLowerCase();
        if(local === '/clear' || local === 'clear'){ document.getElementById('output').innerHTML = ''; input.value=''; return; }
        if(local === '/help' || local === 'help' || local === '?'){ addMsg('cmd', command); addHelp(); input.value=''; return; }

        addMsg('cmd', command);
        cmds.push(command); cmdIdx = cmds.length;
        input.value = '';
        showThinking('processing ' + command + ' ...');
        const t0 = Date.now();
        const r = await call('/api/terminal/execute', { method:'POST', body:JSON.stringify({command}) });
        hideThinking();
        const latency = Date.now() - t0;
        updateStatusBar(latency);

        if(r.error || r.type === 'terminal:error'){
          const msg = (r.message || r.error || 'command failed');
          addMsg('error', '✗ ' + msg);
          // Suggest similar commands on unknown-command errors
          const m = String(msg).match(/unknown command:? ?\/?([a-z-]+)/i);
          if(m){
            const partial = m[1].slice(0, 4);
            const sug = Object.keys(COMMANDS).filter(c => c.includes(partial));
            if(sug.length) addMsg('info', 'Did you mean: ' + sug.join(', ') + ' ?');
          }
        } else if(r.answer){
          addMsg('resp', r.answer, 'model: ' + (r.model||'?') + ' · ' + (r.latencyMs||0) + 'ms · '
            + (r.usage?.promptTokens||0) + '+' + (r.usage?.completionTokens||0) + ' tokens');
        } else if(r.percentComplete !== undefined){
          addMsg('info', 'Roadmap: ' + r.percentComplete + '% · ' + r.shipped + '/' + r.total + ' shipped');
        } else if(r.metrics){
          const m = r.metrics;
          addMsg('resp', 'ENGINEERING HEALTH', 'CI: ' + (m.ciDetail||'?') + ' ' + (m.ci||0) + '%\nTests/E2E: ' + (m.tests||'?') + '/' + (m.e2e||'?')
            + '\nAgents: ' + (m.agents||'?') + '/11 · Mock: ' + (m.mockData||0) + '\nBootstrap: ' + (m.bootstrapAgeHours ?? '?') + 'h · Avg PR: ' + (m.avgPrFiles||'?') + ' files');
        } else if(r.code){
          addMsg('resp', r.code, 'generated by ' + (r.model||'gemini'));
        } else if(r.type){
          // Pretty-print structured responses (JSON) instead of raw slice
          const { type, timestamp, ...rest } = r;
          const keys = Object.keys(rest);
          if(keys.length && (keys.length <= 8)){
            let txt = type.replace('terminal:', '').toUpperCase() + '\n';
            for(const k of keys){
              const v = rest[k];
              txt += k + ': ' + (typeof v === 'object' ? JSON.stringify(v).slice(0, 120) : String(v)) + '\n';
            }
            addMsg('resp', txt.trim());
          } else {
            addMsg('resp', '', '', rest);
          }
        }
        updateSwarm(); updateShield(); updateRoadmap(); updatePulse(); updateBus();
      }
      function quick(cmd){
        const input = document.getElementById('cmd-input');
        input.value = cmd;
        execute();
      }

      // ── Status bar (last command latency + version) ──
      function updateStatusBar(ms){
        const el = document.getElementById('status-latency');
        if(el) el.textContent = 'last: ' + ms + 'ms';
      }

      // ── Tab completion ──
      function complete(){
        const input = document.getElementById('cmd-input');
        const v = input.value;
        const m = v.match(/^(\/[a-z-]*)$/i);
        if(!m) return;
        const matches = Object.keys(COMMANDS).filter(c => c.startsWith(v.toLowerCase()));
        if(matches.length === 1){
          input.value = matches[0] + ' ';
        } else if(matches.length > 1){
          addMsg('info', matches.join('  '));
        }
      }

      // ── Command palette (Ctrl+K) ──
      let _palette = null;
      function togglePalette(){
        if(_palette){ _palette.remove(); _palette = null; return; }
        _palette = document.createElement('div');
        _palette.id = 'palette';
        const box = document.createElement('div');
        box.className = 'palette-box';
        const input = document.createElement('input');
        input.placeholder = 'Type a command…';
        input.className = 'palette-input';
        const list = document.createElement('div');
        list.className = 'palette-list';
        const render = (filter) => {
          const q = (filter||'').toLowerCase();
          const items = Object.entries(COMMANDS).filter(([c]) => !q || c.includes(q)).slice(0, 12);
          list.innerHTML = '';
          for(const [c, desc] of items){
            const it = document.createElement('div');
            it.className = 'palette-item';
            it.innerHTML = '<span class="palette-cmd">' + c + '</span><span class="palette-desc">' + desc + '</span>';
            it.onclick = () => { execute(c); closePalette(); };
            list.appendChild(it);
          }
        };
        input.oninput = () => render(input.value);
        input.onkeydown = (e) => {
          if(e.key === 'Enter' && list.firstChild){
            list.firstChild.click();
          } else if(e.key === 'Escape'){
            closePalette();
          }
        };
        box.appendChild(input); box.appendChild(list);
        _palette.appendChild(box);
        document.body.appendChild(_palette);
        render('');
        input.focus();
      }
      function closePalette(){
        if(_palette){ _palette.remove(); _palette = null; }
      }

      // ── Init ──
      async function init(){
        await Promise.all([updateTopBar(), updateSwarm(), updateShield(), updateRoadmap(), updatePulse(), updateBus()]);
        setInterval(updateTopBar, 15000);
        setInterval(updateSwarm, 10000);
        setInterval(updateShield, 10000);
        setInterval(updateRoadmap, 30000);
        setInterval(updatePulse, 30000);
        setInterval(updateBus, 20000);
        const input = document.getElementById('cmd-input');
        input.focus();
        // Status bar
        const sb = document.createElement('div');
        sb.className = 'statusbar';
        sb.innerHTML = '<span>KUDBEE TERMINAL</span><span class="spacer"></span><span id="status-latency">last: —</span><span class="status-hint">Tab ⭾ complete · Ctrl+K palette · ↑↓ history · Ctrl+L clear</span>';
        document.getElementById('main').appendChild(sb);
      }

      // ── Keyboard ──
      document.addEventListener('keydown', e => {
        const input = document.getElementById('cmd-input');
        if(e.ctrlKey && e.key === 'k'){ e.preventDefault(); togglePalette(); return; }
        if(e.key === 'Tab' && document.activeElement === input){ e.preventDefault(); complete(); return; }
        if(e.key === 'ArrowUp' && cmdIdx > 0){ e.preventDefault(); input.value = cmds[--cmdIdx] || ''; }
        if(e.key === 'ArrowDown' && cmdIdx < cmds.length - 1){ e.preventDefault(); input.value = cmds[++cmdIdx] || ''; }
        if(e.ctrlKey && e.key === 'l'){ e.preventDefault(); document.getElementById('output').innerHTML = ''; }
      });
    </script>
  </body>
</html>
