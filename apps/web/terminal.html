<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KUDBEE Terminal</title>
    <style>
      :root {
        --bg: #0a0a0f; --card: #111827; --border: #1e293b;
        --text: #e2e8f0; --muted: #64748b; --emerald: #34d399;
        --amber: #f59e0b; --rose: #f87171; --blue: #60a5fa;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg); color: var(--text); min-height: 100vh;
      }
      #app { display: flex; height: 100vh; overflow: hidden; }
      /* ── Sidebar ── */
      #sidebar {
        width: 280px; min-width: 280px; background: var(--card);
        border-right: 1px solid var(--border); display: flex;
        flex-direction: column; overflow-y: auto;
      }
      #sidebar h2 { padding: 16px 16px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.15em; }
      .agent-row {
        display: flex; align-items: center; gap: 8px; padding: 6px 16px;
        font-size: 11px; border-left: 3px solid transparent;
      }
      .agent-row.online { border-left-color: var(--emerald); }
      .agent-row.unknown { border-left-color: var(--muted); }
      .agent-dot { width: 6px; height: 6px; border-radius: 50%; }
      .agent-dot.online { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
      .agent-dot.unknown { background: var(--muted); }
      /* ── Shield Panel ── */
      #shield-panel { padding: 12px 16px; border-top: 1px solid var(--border); }
      .shield-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 10px; }
      .shield-name { font-weight: bold; }
      .shield-val { color: var(--muted); }
      .shield-bar { height: 3px; border-radius: 2px; margin-top: 2px; }
      /* ── Main ── */
      #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      #topbar {
        display: flex; align-items: center; gap: 12px; padding: 8px 16px;
        border-bottom: 1px solid var(--border); background: var(--card); font-size: 10px;
      }
      .top-dot { width: 8px; height: 8px; border-radius: 50%; }
      .top-dot.live { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
      .top-dot.degraded { background: var(--amber); }
      /* ── Terminal ── */
      #terminal {
        flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column;
        gap: 6px;
      }
      .msg { padding: 8px 12px; border-radius: 6px; font-size: 11px; max-width: 85%; }
      .msg.cmd { align-self: flex-end; background: var(--blue); color: #000; }
      .msg.resp { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
      .msg.resp pre { white-space: pre-wrap; word-break: break-word; margin-top: 4px; font-size: 10px; color: var(--muted); }
      /* ── Input ── */
      #input-bar {
        display: flex; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--card);
      }
      #cmd-input {
        flex: 1; background: #020617; border: 1px solid var(--border); border-radius: 6px;
        padding: 10px 14px; color: var(--text); font: inherit; font-size: 12px; outline: none;
      }
      #cmd-input:focus { border-color: var(--emerald); }
      #run-btn {
        margin-left: 8px; padding: 10px 20px; background: var(--emerald); color: #000;
        border: none; border-radius: 6px; font: inherit; font-weight: bold; cursor: pointer;
      }
      /* ── Right panel (roadmap + bus) ── */
      #right-panel {
        width: 260px; min-width: 260px; background: var(--card);
        border-left: 1px solid var(--border); display: flex; flex-direction: column;
        overflow-y: auto; padding: 16px;
      }
      #right-panel h2 { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 6px; }
      .phase-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 10px; border-bottom: 1px solid rgba(30,41,59,0.5); }
      .phase-s { color: var(--emerald); } .phase-v { color: var(--blue); } .phase-i { color: var(--amber); } .phase-p { color: var(--muted); }
      #bus-events { font-size: 9px; color: var(--muted); margin-top: 8px; max-height: 200px; overflow-y: auto; }
      .bus-event { padding: 3px 0; border-bottom: 1px solid rgba(30,41,59,0.3); }
      /* ── Mobile ── */
      @media (max-width: 768px) {
        #sidebar, #right-panel { display: none; }
        #main { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar: Agent swarm + Shield monitor -->
      <div id="sidebar">
        <h2>Swarm</h2>
        <div id="swarm-tree"></div>
        <div id="shield-panel">
          <h2>Shield (P·L·R·I)</h2>
          <div id="shield-metrics"></div>
        </div>
      </div>

      <!-- Main: Top bar + Terminal -->
      <div id="main">
        <div id="topbar">
          <span class="top-dot live" id="sys-dot"></span>
          <span id="sys-status">connecting</span>
          <span style="flex:1"></span>
          <span id="sys-sha">—</span>
          <span id="sys-env">—</span>
        </div>
        <div id="terminal">
          <div class="msg resp">
            KUDBEE Terminal v2.2
            Commands: /swarm status, /shield monitor, /ask &lt;question&gt;, /roadmap, /health, /help
          </div>
        </div>
        <div id="input-bar">
          <input id="cmd-input" placeholder="/ask What is the current mission?"
            onkeydown="if(event.key==='Enter')runCommand()" />
          <button id="run-btn" onclick="runCommand()">RUN</button>
        </div>
      </div>

      <!-- Right: Roadmap + Bus events -->
      <div id="right-panel">
        <h2>Roadmap</h2>
        <div id="roadmap"></div>
        <h2 style="margin-top: 16px">Bus Events</h2>
        <div id="bus-events">connecting...</div>
      </div>
    </div>

    <script>
      const API = window.location.origin;
      let sysOnline = false;

      async function api(endpoint, opts = {}) {
        const res = await fetch(API + endpoint, {
          headers: { 'Content-Type': 'application/json' },
          ...opts,
          signal: AbortSignal.timeout(15000),
        });
        return res.json();
      }

      // ── Top bar: system status ──
      async function updateTopBar() {
        try {
          const h = await api('/health');
          sysOnline = h.status === 'ok' || h.status === 'degraded';
          document.getElementById('sys-dot').className = 'top-dot ' + (sysOnline ? 'live' : 'degraded');
          document.getElementById('sys-status').textContent = sysOnline ? 'ONLINE' : 'DEGRADED';
          document.getElementById('sys-env').textContent = h.phase || '—';
          document.getElementById('sys-sha').textContent = 'SHA: ' + API;
        } catch(e) { document.getElementById('sys-status').textContent = 'OFFLINE'; }
      }

      // ── Sidebar: Swarm + Shield ──
      async function updateSwarm() {
        try {
          const r = await api('/api/terminal/execute', { method: 'POST', body: JSON.stringify({ command: '/swarm status' }) });
          if (r.type !== 'swarm:status') return;
          let html = '';
          for (const a of r.tree || []) {
            const cls = a.status === 'online' ? 'online' : 'unknown';
            html += '<div class="agent-row ' + cls + '">'
              + '<span class="agent-dot ' + cls + '"></span>' + a.agent
              + '<span style="margin-left:auto;font-size:9px;color:var(--muted)">' + (a.subs?.length || 0) + ' subs</span>'
              + '</div>';
          }
          document.getElementById('swarm-tree').innerHTML = html;
        } catch(e) {}
      }

      async function updateShield() {
        try {
          const r = await api('/api/terminal/execute', { method: 'POST', body: JSON.stringify({ command: '/shield monitor' }) });
          if (r.type !== 'shield:metrics') return;
          const layers = r.layers || {};
          let html = '';
          for (const [key, l] of Object.entries(layers)) {
            const color = l.status === 'safe' ? 'var(--emerald)' : 'var(--amber)';
            html += '<div class="shield-row">'
              + '<span class="shield-name">' + l.name + ' (' + key + ')</span>'
              + '<span class="shield-val">' + (l.magnitude || 0).toFixed(2) + '</span>'
              + '</div>'
              + '<div class="shield-bar" style="width:' + ((l.magnitude||0)*100) + '%;background:' + color + '"></div>';
          }
          html += '<div style="margin-top:6px;font-size:10px;color:var(--muted)">' + (r.overall || '') + '</div>';
          document.getElementById('shield-metrics').innerHTML = html;
        } catch(e) {}
      }

      // ── Right: Roadmap + Bus ──
      async function updateRoadmap() {
        try {
          const r = await api('/api/terminal/execute', { method: 'POST', body: JSON.stringify({ command: '/roadmap' }) });
          if (r.type !== 'roadmap:status') return;
          let html = '<div style="font-size:10px;margin-bottom:4px">' + r.percentComplete + '% complete (' + r.shipped + '/' + r.total + ' shipped)</div>';
          for (const p of r.phases || []) {
            const cls = p.status === 'shipped' ? 'phase-s' : p.status === 'verified' ? 'phase-v' : p.status === 'in_progress' ? 'phase-i' : 'phase-p';
            html += '<div class="phase-row"><span class="' + cls + '">' + p.id + '</span><span>' + p.name.slice(0,22) + '</span></div>';
          }
          document.getElementById('roadmap').innerHTML = html;
        } catch(e) {}
      }

      // ── Terminal command execution ──
      async function runCommand(cmd) {
        const input = document.getElementById('cmd-input');
        const command = cmd || input.value.trim();
        if (!command) return;
        const term = document.getElementById('terminal');
        term.innerHTML += '<div class="msg cmd">$ ' + command + '</div>';
        input.value = '';
        try {
          const r = await api('/api/terminal/execute', { method: 'POST', body: JSON.stringify({ command }) });
          let respHtml = '<div class="msg resp">' + r.type;
          if (r.answer) {
            respHtml += '<div>' + r.answer + '</div>';
            respHtml += '<pre>model: ' + r.model + ' | latency: ' + r.latencyMs + 'ms | tokens: ' + JSON.stringify(r.usage) + '</pre>';
          } else if (r.message) {
            respHtml += '<div>' + r.message + '</div>';
          } else {
            respHtml += '<pre>' + JSON.stringify(r, null, 1).slice(0, 600) + '</pre>';
          }
          respHtml += '</div>';
          term.innerHTML += respHtml;
        } catch(e) {
          term.innerHTML += '<div class="msg resp">ERROR: ' + e.message + '</div>';
        }
        term.scrollTop = term.scrollHeight;
        // Refresh side panels after command
        updateSwarm(); updateShield(); updateRoadmap();
      }

      // ── Initial load ──
      async function init() {
        await Promise.all([updateTopBar(), updateSwarm(), updateShield(), updateRoadmap()]);
        setInterval(updateTopBar, 15000);
        setInterval(updateSwarm, 10000);
        setInterval(updateShield, 10000);
        setInterval(updateRoadmap, 30000);
      }
      init();
    </script>
  </body>
</html>
