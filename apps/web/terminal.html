<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <title>KUDBEE Terminal</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      :root{
        --bg: #020617; --surface: #0f172a; --card: #111827; --card-hover: #1e293b;
        --border: #1e293b; --border-active: #334155;
        --text: #e2e8f0; --text-dim: #94a3b8; --muted: #64748b;
        --emerald: #34d399; --emerald-bg: rgba(52,211,153,0.08);
        --amber: #f59e0b; --amber-bg: rgba(245,158,11,0.08);
        --rose: #f87171; --rose-bg: rgba(248,113,113,0.08);
        --blue: #60a5fa; --blue-bg: rgba(96,165,250,0.08);
        --radius: 8px; --radius-lg: 12px;
      }
      body{
        font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
        background:var(--bg);color:var(--text);min-height:100vh;
        -webkit-font-smoothing:antialiased;
      }
      #app{display:flex;height:100vh;overflow:hidden}
      /* ── Launch screen ── */
      #launch{
        position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
        align-items:center;justify-content:center;background:var(--bg);
        transition:opacity .4s,visibility .4s;
      }
      #launch.hidden{opacity:0;visibility:hidden;pointer-events:none}
      #launch-logo{
        font-size:32px;font-weight:800;letter-spacing:-.02em;
        background:linear-gradient(135deg,var(--emerald),var(--blue));
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        margin-bottom:4px;
      }
      #launch-sub{font-size:12px;color:var(--muted);margin-bottom:32px}
      #launch-bar{
        width:240px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;
      }
      #launch-fill{height:100%;width:0;background:var(--emerald);border-radius:2px;transition:width .3s}
      #launch-msg{font-size:10px;color:var(--muted);margin-top:12px;min-height:16px}
      /* ── Sidebar ── */
      #sidebar{
        width:280px;min-width:280px;background:var(--surface);
        border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:auto;
      }
      .side-section{border-bottom:1px solid var(--border);padding:14px 16px}
      .side-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
      .agent-item{
        display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;
        font-size:11px;cursor:default;transition:background .15s;
      }
      .agent-item:hover{background:var(--card-hover)}
      .agent-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
      .agent-dot.online{background:var(--emerald);box-shadow:0 0 6px var(--emerald)}
      .agent-dot.unknown{background:var(--muted)}
      .agent-subs{font-size:9px;color:var(--muted)}
      /* Shield */
      .shield-metric{margin-bottom:8px}
      .shield-row{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px}
      .shield-key{font-weight:700}
      .shield-val{color:var(--muted);font-size:9px}
      .shield-track{height:4px;border-radius:2px;background:var(--border);overflow:hidden}
      .shield-fill{height:100%;border-radius:2px;transition:width .3s}
      /* ── Main ── */
      #main{flex:1;display:flex;flex-direction:column;overflow:hidden}
      #topbar{
        display:flex;align-items:center;gap:12px;padding:10px 16px;
        border-bottom:1px solid var(--border);background:var(--surface);font-size:10px;
      }
      .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
      .dot.live{background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
      .dot.degraded{background:var(--amber);box-shadow:0 0 8px var(--amber)}
      .dot.offline{background:var(--rose);box-shadow:0 0 8px var(--rose)}
      .spacer{flex:1}
      .badge{
        font-size:9px;padding:2px 8px;border-radius:10px;background:var(--border);
        color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em;
      }
      /* ── Terminal content ── */
      #output{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px}
      #output .msg{padding:10px 14px;border-radius:var(--radius);font-size:12px;max-width:88%;line-height:1.5;animation:msgIn .15s ease-out}
      @keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
      #output .msg.cmd{align-self:flex-end;background:var(--blue);color:#020617;font-weight:600;border-radius:var(--radius) var(--radius) 4px var(--radius)}
      #output .msg.resp{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-radius:4px var(--radius) var(--radius) var(--radius)}
      #output .msg.error{align-self:flex-start;background:var(--rose-bg);border:1px solid rgba(248,113,113,0.3);color:var(--rose)}
      #output .msg.info{align-self:center;font-size:10px;color:var(--muted);background:transparent;padding:4px 8px;max-width:100%}
      #output .mono{font-family:inherit;font-size:10px;color:var(--muted);white-space:pre-wrap;word-break:break-word;margin-top:4px}
      .token-stats{font-size:9px;color:var(--muted);margin-top:4px}
      /* ── Input bar ── */
      #input-bar{display:flex;padding:10px 16px;border-top:1px solid var(--border);background:var(--surface);gap:8px}
      #cmd-input{
        flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
        padding:10px 14px;color:var(--text);font:inherit;font-size:12px;outline:none;
        transition:border-color .15s;
      }
      #cmd-input:focus{border-color:var(--emerald)}
      #run-btn{
        padding:10px 18px;background:var(--emerald);color:#020617;border:none;
        border-radius:var(--radius);font:inherit;font-size:12px;font-weight:700;
        cursor:pointer;transition:opacity .15s;
      }
      #run-btn:hover{opacity:.85}
      #run-btn:active{opacity:.7}
      #cmd-hint{font-size:9px;color:var(--muted);text-align:right;padding-right:4px}
      /* ── Right panel ── */
      #right{
        width:260px;min-width:260px;background:var(--surface);
        border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:auto;
      }
      .phase-item{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-radius:4px;font-size:10px;transition:background .1s}
      .phase-item:hover{background:var(--card-hover)}
      .phase-id{font-weight:700;font-size:9px;width:42px;flex-shrink:0}
      .phase-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .phase-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
      .p-shipped{color:var(--emerald)}.p-verified{color:var(--blue)}.p-in_progress{color:var(--amber)}.p-planned{color:var(--muted)}
      .bus-feed{font-size:9px;color:var(--muted)}
      .bus-feed div{padding:3px 0;border-bottom:1px solid rgba(30,41,59,0.4)}
      /* ── Responsive ── */
      @media(max-width:768px){
        #sidebar,#right{display:none}
        #main{width:100%}
        #output .msg{max-width:95%}
      }
    </style>
  </head>
  <body>
    <!-- Launch screen -->
    <div id="launch">
      <div id="launch-logo">KUDBEE</div>
      <div id="launch-sub">Engineering OS v2.2</div>
      <div id="launch-bar"><div id="launch-fill"></div></div>
      <div id="launch-msg">Initializing terminal runtime...</div>
    </div>

    <!-- Main app -->
    <div id="app">
      <!-- Sidebar -->
      <div id="sidebar">
        <div class="side-section">
          <div class="side-label">Swarm Fleet</div>
          <div id="swarm-tree"><span style="color:var(--muted);font-size:10px">connecting...</span></div>
        </div>
        <div class="side-section">
          <div class="side-label">Shield (P·L·R·I)</div>
          <div id="shield-metrics"><span style="color:var(--muted);font-size:10px">connecting...</span></div>
        </div>
      </div>

      <!-- Main: topbar + terminal -->
      <div id="main">
        <div id="topbar">
          <span class="dot offline" id="sys-dot"></span>
          <span id="sys-status">OFFLINE</span>
          <span class="spacer"></span>
          <span id="sys-sha" class="badge">—</span>
          <span id="sys-env" class="badge">STAGING</span>
        </div>
        <div id="output"></div>
        <div style="padding:0 16px"><div id="cmd-hint">Try: /swarm status, /shield monitor, /roadmap, /ask &lt;question&gt;, /help</div></div>
        <div id="input-bar">
          <input id="cmd-input" placeholder="/ask What is the current mission?" autofocus autocomplete="off"
            onkeydown="if(event.key==='Enter')execute();" />
          <button id="run-btn" onclick="execute()">RUN</button>
        </div>
      </div>

      <!-- Right panel -->
      <div id="right">
        <div class="side-section">
          <div class="side-label">Roadmap to Production</div>
          <div id="roadmap"><span style="color:var(--muted);font-size:10px">connecting...</span></div>
        </div>
        <div class="side-section">
          <div class="side-label">Bus Feed</div>
          <div class="bus-feed" id="bus-feed"><span style="color:var(--muted);font-size:10px">connecting...</span></div>
        </div>
      </div>
    </div>

    <script>
      const API = '';
      const cmds = []; let cmdIdx = -1; let sysOnline = false;

      // ── Launch sequence ──
      (async function boot(){
        const fill = document.getElementById('launch-fill');
        const msg = document.getElementById('launch-msg');
        const steps = [
          ['Connecting to Control Tower...', 20],
          ['Verifying agent fleet...', 45],
          ['Loading shield metrics...', 70],
          ['Syncing roadmap...', 90],
          ['Ready.', 100]
        ];
        for(const [text, pct] of steps){
          fill.style.width = pct + '%';
          msg.textContent = text;
          await new Promise(r=>setTimeout(r, 300));
        }
        document.getElementById('launch').classList.add('hidden');
        init();
      })();

      // ── API helper ──
      async function call(endpoint, opts = {}){
        const signal = AbortSignal.timeout(20000);
        try {
          const res = await fetch(API + endpoint, { headers: {'Content-Type':'application/json'}, signal, ...opts });
          return await res.json();
        } catch(e) { return { error: e.message }; }
      }

      // ── Top bar ──
      async function updateTopBar(){
        try {
          const h = await call('/health');
          if(!h || h.error){ setTop('OFFLINE','offline'); return; }
          sysOnline = h.status === 'ok' || h.dependencies;
          setTop(sysOnline ? 'ONLINE' : 'DEGRADED', sysOnline ? 'live' : 'degraded');
          document.getElementById('sys-env').textContent = (h.phase || '—').toUpperCase();
        } catch { setTop('OFFLINE','offline'); }
      }
      function setTop(label, cls){
        document.getElementById('sys-status').textContent = label;
        document.getElementById('sys-dot').className = 'dot ' + cls;
      }

      // ── Swarm tree ──
      async function updateSwarm(){
        const r = await call('/api/terminal/execute', { method:'POST', body:JSON.stringify({command:'/swarm status'}) });
        if(!r || r.type !== 'swarm:status') return document.getElementById('swarm-tree').innerHTML =
          '<span style="color:var(--rose);font-size:10px">swarm unreachable</span>';
        document.getElementById('swarm-tree').innerHTML = (r.tree||[]).map(a =>
          '<div class="agent-item">'
          + '<span class="agent-dot ' + (a.status==='online'?'online':'unknown') + '"></span>'
          + a.agent
          + '<span style="flex:1"></span>'
          + '<span class="agent-subs">' + (a.subs?.length||0) + '</span>'
          + '</div>'
        ).join('');
      }

      // ── Shield ──
      async function updateShield(){
        const r = await call('/api/terminal/execute', { method:'POST', body:JSON.stringify({command:'/shield monitor'}) });
        if(!r || r.type !== 'shield:metrics') return;
        const layers = r.layers || {};
        let h = '';
        for(const [k,l] of Object.entries(layers)){
          const mag = l.magnitude||0; const safe = l.status==='safe';
          h += '<div class="shield-metric">'
            + '<div class="shield-row"><span class="shield-key">' + l.name + ' (' + k + ')</span><span class="shield-val">' + mag.toFixed(2) + (safe?' ✓':' ⚠') + '</span></div>'
            + '<div class="shield-track"><div class="shield-fill" style="width:'+(mag*100)+'%;background:'+(safe?'var(--emerald)':'var(--amber)')+'"></div></div>'
            + '</div>';
        }
        h += '<div style="font-size:10px;color:var(--muted);margin-top:4px">' + (r.overall||'') + '</div>';
        document.getElementById('shield-metrics').innerHTML = h;
      }

      // ── Roadmap ──
      async function updateRoadmap(){
        const r = await call('/api/terminal/execute', { method:'POST', body:JSON.stringify({command:'/roadmap'}) });
        if(!r || r.total === undefined) return;
        const phaseDot = {shipped:'●',verified:'○',in_progress:'◉',planned:'·'};
        document.getElementById('roadmap').innerHTML = (r.phases||[]).map(p =>
          '<div class="phase-item">'
          + '<span class="phase-id p-' + p.status + '">' + p.id + '</span>'
          + '<span class="phase-name">' + p.name + '</span>'
          + '<span class="phase-dot p-' + p.status + '"></span>'
          + '</div>'
        ).join('');
      }

      // ── Bus feed ──
      async function updateBus(){
        const el = document.getElementById('bus-feed');
        try {
          const r = await call('/api/ci/status');
          el.innerHTML = '<div>CI: ' + (r.status||'?') + '</div>';
        } catch { el.innerHTML = '<div>bus offline</div>'; }
      }

      // ── Command execution ──
      function addMsg(type, text, extra){
        const o = document.getElementById('output');
        const div = document.createElement('div');
        div.className = 'msg ' + type;
        div.textContent = text;
        if(extra) { const pre = document.createElement('div'); pre.className = 'mono'; pre.textContent = extra; div.appendChild(pre); }
        o.appendChild(div);
        o.scrollTop = o.scrollHeight;
      }
      async function execute(cmd){
        const input = document.getElementById('cmd-input');
        const command = cmd || input.value.trim();
        if(!command) return;
        addMsg('cmd', command);
        cmds.push(command); cmdIdx = cmds.length;
        input.value = '';
        try {
          const r = await call('/api/terminal/execute', { method:'POST', body:JSON.stringify({command}) });
          if(r.error || r.type === 'terminal:error'){
            addMsg('error', '✗ ' + (r.message || r.error));
          } else if(r.answer){
            addMsg('resp', r.answer,
              'model: ' + r.model + ' · ' + r.latencyMs + 'ms · '
              + (r.usage?.promptTokens||0) + '+' + (r.usage?.completionTokens||0) + ' tokens'
            );
          } else if(r.percentComplete !== undefined){
            addMsg('info', 'Roadmap: ' + r.percentComplete + '% · ' + r.total + ' phases · ' + r.shipped + ' shipped');
          } else if(r.type){
            addMsg('resp', JSON.stringify(r).slice(0, 500));
          }
        } catch(e){ addMsg('error', '✗ ' + e.message); }
        updateSwarm(); updateShield(); updateRoadmap(); updateBus();
      }

      // ── Init ──
      async function init(){
        await Promise.all([updateTopBar(), updateSwarm(), updateShield(), updateRoadmap(), updateBus()]);
        setInterval(updateTopBar, 15000);
        setInterval(updateSwarm, 10000);
        setInterval(updateShield, 10000);
        setInterval(updateRoadmap, 30000);
        setInterval(updateBus, 20000);
        document.getElementById('cmd-input').focus();
      }

      // ── Keyboard shortcuts ──
      document.addEventListener('keydown', e => {
        if(e.key === 'ArrowUp' && cmdIdx > 0){
          e.preventDefault();
          document.getElementById('cmd-input').value = cmds[--cmdIdx] || '';
        }
        if(e.key === 'ArrowDown' && cmdIdx < cmds.length - 1){
          e.preventDefault();
          document.getElementById('cmd-input').value = cmds[++cmdIdx] || '';
        }
        if(e.ctrlKey && e.key === 'l'){
          e.preventDefault();
          document.getElementById('output').innerHTML = '';
        }
      });
    </script>
  </body>
</html>
