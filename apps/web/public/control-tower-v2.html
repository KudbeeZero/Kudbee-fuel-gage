<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kudbee Control Tower — v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:ui-monospace,'Cascadia Code',monospace;background:#020617;color:#e2e8f0;min-height:100vh}
.header{background:#0f172a;border-bottom:1px solid #1e293b;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.1rem;color:#34d399;font-weight:700}
.status-dots{display:flex;gap:.75rem;font-size:.65rem}
.dot{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .5rem;border-radius:1rem;font-weight:600}
.dot.ok{background:#065f4620;color:#34d399;border:1px solid #065f46}
.dot.err{background:#7f1d1d20;color:#f87171;border:1px solid #7f1d1d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem;padding:1.5rem}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:.75rem;padding:1.25rem}
.card h3{font-size:.8rem;color:#34d399;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.1em}
.metric{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid #1e293b20;font-size:.75rem}
.metric:last-child{border:none}
.metric label{color:#64748b}
.metric span{color:#e2e8f0;font-weight:600}
.big-num{font-size:2rem;font-weight:800;color:#34d399;font-family:monospace}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.btn{background:#065f46;color:#fff;border:none;padding:.4rem 1rem;border-radius:.5rem;font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#059669}
.btn.outline{background:transparent;border:1px solid #334155;color:#94a3b8}
.btn.wallet{background:#9945ff;border-color:#9945ff}
.btn.wallet:hover{background:#7c3aed}
.btn.wallet.connected{background:#065f46;border-color:#065f46}
.connect-status{font-size:.6rem;color:#a78bfa;margin-top:.25rem}
.loading{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.footer{position:fixed;bottom:0;left:0;right:0;background:#0f172aaa;border-top:1px solid #1e293b;padding:.3rem 1.5rem;font-size:.6rem;color:#475569;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="header">
  <h1>◈ Kudbee Control Tower v2</h1>
  <div class="status-dots" id="status-dots">
    <span class="dot loading">⏳ Loading...</span>
  </div>
</div>

<div class="grid">
  <!-- Database -->
  <div class="card">
    <h3>📊 Database</h3>
    <div class="metric"><label>Total Size</label><span id="db-size">—</span></div>
    <div class="metric"><label>THINK Tokens</label><span id="db-think">—</span></div>
    <div class="metric"><label>Governance</label><span id="db-gov">—</span></div>
    <div class="metric"><label>Telemetry</label><span id="db-tel">—</span></div>
    <div class="actions">
      <button class="btn" onclick="refreshDashboard()">Refresh</button>
    </div>
  </div>

  <!-- Agents -->
  <div class="card">
    <h3>🤖 Agent Swarm</h3>
    <div class="metric"><label>Total Agents</label><span id="ag-total">—</span></div>
    <div class="metric"><label>Online</label><span id="ag-online">—</span></div>
    <div class="metric"><label>Decisions</label><span id="ag-decisions">—</span></div>
    <div class="metric"><label>Convoys</label><span id="ag-convoys">—</span></div>
    <div class="actions">
      <button class="btn" onclick="launchAgent('gastown')">Launch Gastown</button>
      <button class="btn outline" onclick="launchAgent('hermes')">Hermes Audit</button>
    </div>
  </div>

  <!-- Solana Wallet -->
  <div class="card">
    <h3>◎ Solana</h3>
    <div class="metric"><label>Network</label><span id="sol-network">—</span></div>
    <div class="metric"><label>Wallet</label><span id="sol-wallet">Not connected</span></div>
    <div class="metric"><label>Balance</label><span id="sol-balance">—</span></div>
    <div class="actions">
      <button class="btn wallet" id="wallet-btn" onclick="connectWallet()">Connect Wallet</button>
      <span class="connect-status" id="wallet-status"></span>
    </div>
  </div>

  <!-- Synapse Security -->
  <div class="card">
    <h3>🛡 Synapse C4769</h3>
    <div class="metric"><label>Fingerprints</label><span id="sy-fp">—</span></div>
    <div class="metric"><label>Violations</label><span id="sy-violations">—</span></div>
    <div class="metric"><label>Lockouts</label><span id="sy-lockouts">—</span></div>
    <div class="metric"><label>Threshold</label><span id="sy-threshold">—</span></div>
    <div class="actions">
      <button class="btn outline" onclick="refreshSynapse()">Refresh</button>
    </div>
  </div>

  <!-- Deploy Status -->
  <div class="card">
    <h3>🚀 Deploy</h3>
    <div class="metric"><label>Status</label><span id="dp-status">—</span></div>
    <div class="metric"><label>Uptime</label><span id="dp-uptime">—</span></div>
    <div class="metric"><label>Release</label><span id="dp-release">—</span></div>
    <div class="actions">
      <button class="btn outline" onclick="refreshDeploy()">Refresh</button>
      <a class="btn" href="/api/gastown/dashboard" target="_blank">API</a>
    </div>
  </div>

  <!-- Terminal Launch -->
  <div class="card">
    <h3>💻 Terminal</h3>
    <div style="margin-top:.5rem">
      <a class="btn" href="/terminal.html" target="_blank">Open Terminal</a>
      <a class="btn outline" href="/api/system/synapse-status" target="_blank">Synapse API</a>
    </div>
  </div>
</div>

<div class="footer" id="footer">
  Kudbee Control Tower v2 | No build step | Immediate load
</div>

<script>
// ── API helpers ──────────────────────────────────────────────────
async function api(url) {
  const r = await fetch(url);
  return r.ok ? r.json() : null;
}

// ── Dashboard refresh ────────────────────────────────────────────
async function refreshDashboard() {
  const d = await api('/api/gastown/dashboard');
  if (!d) return;
  setText('db-size', d.database?.totalSize || '?');
  setText('db-think', `${d.database?.thinkTokens?.count || 0} / ${d.database?.thinkTokens?.size || '?'}`);
  setText('db-gov', `${d.database?.governanceActions?.count || 0} / ${d.database?.governanceActions?.size || '?'}`);
  setText('db-tel', `${d.database?.telemetryLogs?.count || 0} / ${d.database?.telemetryLogs?.size || '?'}`);
  setText('ag-total', d.swarm?.agents || '?');
  setText('ag-online', d.swarm?.online || '?');
  setText('ag-convoys', d.activeConvoys || 0);
  setText('sy-fp', d.synapse === 'C4769 active' ? 'ACTIVE' : '?');
  updateStatus([{db:true,redis:true,synapse:true,agents:d.swarm?.online > 0}]);
}

async function refreshSynapse() {
  const s = await api('/api/system/synapse-status');
  if (!s) return;
  setText('sy-fp', s.knownFingerprints || 0);
  setText('sy-violations', s.violations?.length || 0);
  setText('sy-lockouts', s.lockedOut?.length || 0);
  setText('sy-threshold', (s.threshold || 0) + ' rad');
}

async function refreshDeploy() {
  const d = await api('/api/system/deploy-status');
  if (!d) return;
  setText('dp-status', d.status || '?');
  setText('dp-uptime', (d.uptimeSec || 0) + 's');
  setText('dp-release', d.herokuRelease || '?');
}

// ── Agent launch ────────────────────────────────────────────────
function launchAgent(name) {
  const el = document.getElementById('ag-decisions');
  el.textContent = 'Launching...';
  api(`/api/agents/${name}/launch`).then(() => {
    el.textContent = 'Dispatched!';
    setTimeout(refreshDashboard, 2000);
  }).catch(() => {
    el.textContent = 'Failed';
  });
}

// ── Solana wallet ────────────────────────────────────────────────
let walletPublicKey = null;

async function connectWallet() {
  if (walletPublicKey) {
    walletPublicKey = null;
    setText('sol-wallet', 'Disconnected');
    setText('sol-balance', '—');
    document.getElementById('wallet-btn').textContent = 'Connect Wallet';
    document.getElementById('wallet-btn').classList.remove('connected');
    return;
  }
  try {
    if (window.solana && window.solana.isPhantom) {
      const resp = await window.solana.connect();
      walletPublicKey = resp.publicKey.toString();
      setText('sol-wallet', walletPublicKey.slice(0,8) + '...' + walletPublicKey.slice(-4));
      document.getElementById('wallet-btn').textContent = 'Disconnect';
      document.getElementById('wallet-btn').classList.add('connected');
      setText('sol-network', 'mainnet-beta');
      getBalance();
    } else {
      window.open('https://phantom.app', '_blank');
      document.getElementById('wallet-status').textContent = 'Install Phantom wallet';
    }
  } catch(e) {
    document.getElementById('wallet-status').textContent = 'Connection refused';
  }
}

async function getBalance() {
  if (!walletPublicKey) return;
  try {
    const r = await fetch('https://api.mainnet-beta.solana.com', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        jsonrpc:'2.0', id:1,
        method:'getBalance',
        params:[walletPublicKey]
      })
    });
    const d = await r.json();
    setText('sol-balance', (d.result?.value / 1e9).toFixed(4) + ' SOL');
  } catch(e) {
    setText('sol-balance', 'RPC error');
  }
}

// ── Utils ────────────────────────────────────────────────────────
function setText(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = String(text);
}

function updateStatus(servers) {
  const s = servers[0];
  const dots = document.getElementById('status-dots');
  if (!dots) return;
  dots.innerHTML = [
    `<span class="dot ${s.db ? 'ok' : 'err'}">DB</span>`,
    `<span class="dot ${s.redis ? 'ok' : 'err'}">Redis</span>`,
    `<span class="dot ${s.agents ? 'ok' : 'err'}">Agents</span>`,
    `<span class="dot ${s.synapse ? 'ok' : 'err'}">Synapse</span>`,
  ].join('');
}

// ── Init ─────────────────────────────────────────────────────────
refreshDashboard();
refreshSynapse();
refreshDeploy();
setText('sol-network', 'mainnet-beta');
setText('ag-decisions', 252);

// Auto-refresh every 30s
setInterval(refreshDashboard, 30000);
setInterval(refreshSynapse, 60000);
</script>
</body>
</html>
