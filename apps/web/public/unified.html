<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kudbee — Unified Control Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020617;--card:#0f172a;--border:#1e293b;--green:#34d399;--muted:#64748b;--text:#e2e8f0;--accent:#06b6d4}
body{background:var(--bg);color:var(--text);font-family:ui-monospace,monospace;height:100vh;display:flex;flex-direction:column}
.nav{display:flex;background:var(--card);border-bottom:1px solid var(--border);font-size:.7rem}
.nav-btn{padding:.6rem 1.2rem;cursor:pointer;color:var(--muted);border:none;background:none;font-family:inherit;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid transparent}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green)}
.nav-btn:hover{color:var(--text)}
.frame{flex:1;border:none;display:none}
.frame.active{display:block}
.status-bar{display:flex;align-items:center;gap:1rem;padding:.3rem 1rem;background:var(--card);border-top:1px solid var(--border);font-size:.6rem;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%}
.dot.green{background:var(--green)}
.dot.red{background:#f87171}
</style>
</head>
<body>
<div class="nav">
  <button class="nav-btn active" onclick="switchView('status',this)">Status</button>
  <button class="nav-btn" onclick="switchView('terminal',this)">Terminal</button>
  <button class="nav-btn" onclick="switchView('dashboard',this)">Dashboard</button>
  <button class="nav-btn" onclick="switchView('cli',this)">CLI</button>
</div>

<iframe id="status" class="frame active" src="/status.html"></iframe>
<iframe id="terminal" class="frame" src="/terminal.html"></iframe>
<iframe id="dashboard" class="frame" src="/control-tower-v2.html"></iframe>
<iframe id="cli" class="frame" src="/cli.html"></iframe>

<div class="status-bar" id="footer">
  <span>Kudbee Control Center</span>
  <span style="margin-left:auto">PG: <span id="pg">—</span></span>
  <span>Redis: <span id="redis">—</span></span>
  <span>Agents: <span id="agents">—</span></span>
</div>

<script>
function switchView(name, btn) {
  document.querySelectorAll('.frame').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  if (btn) btn.classList.add('active');
}

async function updateFooter() {
  try {
    const r = await fetch('/health'); const d = await r.json();
    document.getElementById('pg').textContent = d.dependencies.ingestion_db;
    document.getElementById('pg').style.color = d.dependencies.ingestion_db==='healthy'?'var(--green)':'#f87171';
    document.getElementById('redis').textContent = d.dependencies.redis;
    document.getElementById('redis').style.color = d.dependencies.redis==='healthy'?'var(--green)':'#f87171';
  } catch {}
  try {
    const r = await fetch('/api/gastown/dashboard'); const d = await r.json();
    document.getElementById('agents').textContent = d.swarm.online+'/'+d.swarm.agents;
  } catch {}
}

updateFooter();
setInterval(updateFooter, 30000);
</script>
</body>
</html>
