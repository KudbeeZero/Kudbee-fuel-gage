<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kudbee Fuel Gauge — AI Cost Intelligence</title>
    <style>
      #boot-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#e2e8f0;font-family:ui-monospace,'Fira Code',monospace}
      #boot-splash h1{font-size:1.5rem;font-weight:700;margin-bottom:.25rem;color:#34d399}
      #boot-splash p{font-size:.75rem;color:#64748b;margin-bottom:1.5rem}
      #boot-splash .spinner{width:2.5rem;height:2.5rem;border:3px solid #1e293b;border-top-color:#34d399;border-radius:50%;animation:kud-spin .8s linear infinite}
      @keyframes kud-spin{to{transform:rotate(360deg)}}
      .boot-done #boot-splash{display:none}
    </style>
    <script>
      document.addEventListener('DOMContentLoaded',function(){
        var r=document.getElementById('root');
        if(!r)return;
        var o=new MutationObserver(function(){
          if(r.children.length>0||r.textContent.trim().length>0){
            document.documentElement.classList.add('boot-done');
            o.disconnect();
          }
        });
        o.observe(r,{childList:true,subtree:true,characterData:true});
        setTimeout(function(){
          if(!document.documentElement.classList.contains('boot-done'))
            document.documentElement.classList.add('boot-done');
        },8000);
      });
    </script>
  </head>
  <body>
    <div id="boot-splash">
      <h1>Kudbee Fuel Gauge</h1>
      <p>AI Cost Intelligence Platform</p>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
