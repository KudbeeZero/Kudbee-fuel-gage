<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="kudbee-version" content="v293" />
    <meta name="kudbee-commit" content="HEAD" />
    <meta name="kudbee-build-time" content="2026-07-29T05:00Z" />
    <title>Kudbee Fuel Gauge — AI Cost Intelligence</title>
    <style>
      #boot-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#e2e8f0;font-family:ui-monospace,monospace}
      #boot-splash h1{font-size:1.5rem;font-weight:700;margin:.5rem 0;color:#34d399}
      #boot-splash p{font-size:.75rem;color:#64748b}
      #boot-splash .spinner{width:2.5rem;height:2.5rem;border:3px solid #1e293b;border-top-color:#34d399;border-radius:50%;animation:kud-spin .8s linear infinite;margin-bottom:2rem}
      @keyframes kud-spin{to{transform:rotate(360deg)}}
      .boot-done #boot-splash{display:none}
      #deploy-footer{position:fixed;bottom:0;left:0;right:0;z-index:99998;background:#0f172aaa;backdrop-filter:blur(8px);border-top:1px solid #1e293b;padding:.25rem .75rem;display:flex;justify-content:space-between;align-items:center;font-family:monospace;font-size:.6rem;color:#475569}
      #deploy-footer.ok{color:#34d399}
      #deploy-footer.degraded{color:#eab308}
      #deploy-footer.error{color:#f87171}
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <h1>Kudbee Fuel Gauge</h1>
      <p>AI Cost Intelligence Platform</p>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <div id="deploy-footer">Connecting to Heroku…</div>
    <script>
      var _kud = { loaded: false, ver: null, health: null, retries: 0 };
      var splashTimeout = setTimeout(function() {
        if (!_kud.loaded) {
          var s = document.getElementById('boot-splash');
          if (s) { s.innerHTML = s.innerHTML.replace('Kudbee Fuel Gauge', 'Kudbee Fuel Gauge').replace(/<p>[^<]*<\/p>/, '<p style="color:#eab308;font-size:.75rem">Still loading…</p>').replace('spinner', 'spinner'); }
        }
      }, 8000);
      var hardTimeout = setTimeout(function() {
        if (!_kud.loaded) {
          var s = document.getElementById('boot-splash');
          if (s) { s.innerHTML = '<h1 style="color:#34d399;font-size:1.5rem">Kudbee Fuel Gauge</h1><p style="color:#eab308;font-size:.75rem">React build unavailable — redirecting to Control Center…</p>'; }
          window.location.replace('/unified.html');
        }
      }, 15000);
      window.addEventListener('kudbee:loaded', function(e) {
        clearTimeout(splashTimeout);
        clearTimeout(hardTimeout);
        _kud.loaded = true;
        _kud.ver = e.detail?.version;
        document.documentElement.classList.add('boot-done');
      });
      fetch('/api/system/deploy-status').then(function(r){return r.json()}).then(function(d){
        _kud.health = d.status;
        var f = document.getElementById('deploy-footer');
        if (f) { f.className = d.status === 'ok' ? 'ok' : 'degraded'; f.textContent = 'Deploy ' + d.commit + ' | ' + d.status + ' | Heroku ' + d.herokuRelease; }
      }).catch(function(){var f=document.getElementById('deploy-footer');if(f){f.className='error';f.textContent='Backend unreachable';}});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
