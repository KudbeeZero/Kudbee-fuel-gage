<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kudbee Fuel Gauge — AI Cost Intelligence</title>
    <style>
      #boot-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#e2e8f0;font-family:ui-monospace,'Fira Code',monospace}
      #boot-splash h1{font-size:1.5rem;font-weight:700;margin-bottom:.25rem;color:#34d399}
      #boot-splash p{font-size:.75rem;color:#64748b;margin-bottom:1.5rem}
      #boot-splash .spinner{width:2.5rem;height:2.5rem;border:3px solid #1e293b;border-top-color:#34d399;border-radius:50%;animation:kud-spin .8s linear infinite}
      @keyframes kud-spin{to{transform:rotate(360deg)}}
      .boot-done #boot-splash{display:none}
    </style>
    <script>
      (function(){
        var t0=Date.now();
        document.addEventListener('DOMContentLoaded',function(){
          var root=document.getElementById('root');
          if(!root)return;
          var done=false;
          function hideSplash(){
            if(done)return;
            done=true;
            document.documentElement.classList.add('boot-done');
          }
          var obs=new MutationObserver(function(){
            if(root.children.length>0||root.textContent.trim().length>0)hideSplash();
          });
          if(root)obs.observe(root,{childList:true,subtree:true,characterData:true});

          setTimeout(function(){
            if(!done){
              hideSplash();
              root.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#e2e8f0;font-family:ui-monospace,monospace;text-align:center;padding:1rem"><h1 style="color:#34d399;font-size:1.5rem">Kudbee Fuel Gauge</h1><p style="color:#64748b;font-size:.75rem;margin-bottom:2rem">AI Cost Intelligence Platform</p><div style="background:#0f172a;border:1px solid #334155;border-radius:.75rem;padding:1.5rem;max-width:20rem"><p style="color:#f87171;font-size:.875rem;font-weight:600;margin-bottom:.5rem">App failed to load</p><p style="color:#94a3b8;font-size:.75rem;margin-bottom:1rem">The application module could not be initialized. This may be caused by a slow connection or restricted browser settings.</p><button onclick="location.reload()" style="background:#059669;color:#fff;border:none;padding:.5rem 1.5rem;border-radius:.5rem;font-size:.875rem;font-weight:600;cursor:pointer">Tap to Retry</button><p style="color:#475569;font-size:.625rem;margin-top:1rem">Elapsed: '+Math.round((Date.now()-t0)/1000)+'s</p></div></div>';
            }
          },10000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash">
      <h1>Kudbee Fuel Gauge</h1>
      <p>AI Cost Intelligence Platform</p>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
