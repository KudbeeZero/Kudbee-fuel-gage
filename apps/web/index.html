<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kudbee Fuel Gauge — AI Cost Intelligence</title>
    <style>
      #boot-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#e2e8f0;font-family:ui-monospace,monospace}
      #boot-splash h1{font-size:1.5rem;font-weight:700;margin:.5rem 0;color:#34d399}
      #boot-splash p{font-size:.75rem;color:#64748b}
      #boot-splash .spinner{width:2.5rem;height:2.5rem;border:3px solid #1e293b;border-top-color:#34d399;border-radius:50%;animation:kud-spin .8s linear infinite;margin-bottom:2rem}
      @keyframes kud-spin{to{transform:rotate(360deg)}}
      .boot-done #boot-splash{display:none}
    </style>
    <script>
      window.__KUD_VER='v277';
      window.__KUD_LOADED=false;
      window.addEventListener('kudbee:loaded',function(){window.__KUD_LOADED=true;hide();});
      function hide(){document.documentElement.classList.add('boot-done');}
      function fail(msg){if(window.__KUD_LOADED)return;hide();var r=document.getElementById('root');if(r)r.innerHTML='<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#e2e8f0;font-family:monospace;text-align:center;padding:1rem"><h1 style="color:#34d399;font-size:1.5rem">Kudbee Fuel Gauge</h1><div style="background:#0f172a;border:1px solid #334155;border-radius:.75rem;padding:1.25rem;margin:1rem 0;max-width:18rem"><p style="color:#f87171;font-weight:600;margin-bottom:.25rem">App did not load</p><p style="color:#94a3b8;font-size:.7rem;margin-bottom:.75rem">'+msg+'</p><button onclick="location.reload()" style="background:#059669;color:#fff;border:none;padding:.5rem 1.5rem;border-radius:.5rem;font-weight:600;cursor:pointer">Retry</button></div><p style="font-size:.6rem;color:#475569">'+new Date().toISOString().slice(0,19)+'</p></div>';}
      try{import('/src/main.tsx').catch(function(e){fail('Load error: '+(e.message||'').slice(0,60));});}catch(e){fail('Import blocked');}
      setTimeout(function(){if(!window.__KUD_LOADED)fail('Timed out');},10000);
    </script>
  </head>
  <body>
    <div id="boot-splash">
      <h1>Kudbee Fuel Gauge</h1>
      <p>AI Cost Intelligence Platform</p>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
